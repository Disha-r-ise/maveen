name: Java CI/CD Pipeline

on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
 build:
  run-on: windows-latest

  steps:
  - name: Checkout repository
  uses: actions/checkout@v4

  - name: Set up JDK 21
  uses: actions/setup-java@v4
  -name: Compile Java Program
  run: javac New.java